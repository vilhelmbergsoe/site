[package]
name = "site"
version = "0.1.0"
edition = "2021"
default-run = "site"
build = "src/build.rs"

[features]
dev = ["dep:notify"]

[[bin]]
name = "dev"
path = "src/bin/dev.rs"
required-features = ["dev"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.6.20"
chrono = "0.4.41"
color-eyre = "0.6.5"
maud = { version = "0.25.0", features = ["axum"] }
notify = { version = "8.2.0", optional = true }
rand = "0.9.2"
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.4.4", features = ["fs", "compression-br", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[build-dependencies]
ructe = "0.16.1"
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"

[profile.release]
lto = true
